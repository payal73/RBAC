name: Deploy full stack app on AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deployment
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          # Optional: cache dependencies for faster builds (npm, yarn, or pnpm)
          cache: "npm"
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # ------------------------------
      # BACKEND SETUP
      # ------------------------------
      - name: Install backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Create backend .env file
        working-directory: ./Backend
        run: |
          echo "Razor_Test_Key_ID = ${{ secrets.Razor_Test_Key_ID }}" >> .env
          echo "Razor_Test_Key_Secret = ${{ secrets.Razor_Test_Key_Secret }}" >> .env

      - name: Run node server
        working-directory: ./Backend
        run: |
          pm2 restart 1 || pm2 start npm --name "RBAC-Backend" -- start

        # ------------------------------
        # FRONTEND SETUP
        # ------------------------------
      - name: Clean npm cache & remove existing dependencies
        working-directory: ./Frontend
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build

      - name: Deploy frontend to Nginx
        working-directory: ./Frontend
        run: |
          sudo rm -rf /var/www/html/*
          sudo scp -r ./dist/* /var/www/html/
